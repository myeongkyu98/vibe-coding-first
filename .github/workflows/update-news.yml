# 매시간 경제 뉴스를 새로 모아 news.json을 갱신
name: Update economic news

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch news
        run: node scripts/fetch-news.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet news.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898293+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update economic news"
          git push
